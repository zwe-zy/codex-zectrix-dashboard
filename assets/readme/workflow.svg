<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Codex 与重置雷达数据到 NOTE4 的路径</title>
  <desc id="desc">官方 Codex 状态和独立的第三方重置雷达由 Mac companion 分别读取，在本地归一化、缓存和渲染，仅在画面变化时推送到 NOTE4。</desc>
  <rect width="1200" height="540" rx="24" fill="#f2f0e8"/>
  <text x="56" y="54" fill="#64625c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">TWO SOURCES / ONE LOCAL FRAME</text>
  <text x="56" y="112" fill="#11110f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="42" font-weight="750">从独立信号到 NOTE4 画面</text>

  <g transform="translate(56 154)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g>
      <rect width="300" height="270" rx="12" fill="#fffef9" stroke="#11110f" stroke-width="2"/>
      <text x="24" y="40" fill="#64625c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">01 / SOURCES</text>
      <text x="24" y="79" fill="#11110f" font-size="25" font-weight="700">Codex 官方状态</text>
      <text x="24" y="111" fill="#34332f" font-size="19">额度窗口 · 重置额度</text>
      <text x="24" y="140" fill="#34332f" font-size="19">任务元数据 · Hooks 事件</text>
      <path d="M24 162H276" stroke="#c9c6bb"/>
      <text x="24" y="202" fill="#11110f" font-size="25" font-weight="700">第三方重置雷达</text>
      <text x="24" y="234" fill="#34332f" font-size="19">公开预测与确认事件</text>
      <text x="24" y="258" fill="#64625c" font-size="18">每小时独立读取</text>
    </g>

    <g transform="translate(394 0)">
      <rect width="238" height="270" rx="12" fill="#11110f"/>
      <text x="24" y="40" fill="#9d9a90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">02 / LOCAL</text>
      <text x="24" y="86" fill="#fffef9" font-size="26" font-weight="700">Companion</text>
      <text x="24" y="127" fill="#c9c6bb" font-size="20">独立调度与校验</text>
      <text x="24" y="159" fill="#c9c6bb" font-size="20">语义缓存</text>
      <text x="24" y="191" fill="#c9c6bb" font-size="20">隐私模式</text>
      <text x="24" y="223" fill="#c9c6bb" font-size="20">400×300 本地渲染</text>
    </g>

    <g transform="translate(726 0)">
      <rect width="190" height="270" rx="12" fill="#fffef9" stroke="#11110f" stroke-width="2"/>
      <text x="22" y="40" fill="#64625c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">03 / PUSH</text>
      <text x="22" y="86" fill="#11110f" font-size="26" font-weight="700">变化检测</text>
      <text x="22" y="132" fill="#34332f" font-size="20">画面哈希</text>
      <text x="22" y="166" fill="#34332f" font-size="20">去重</text>
      <text x="22" y="200" fill="#34332f" font-size="20">推送节流</text>
      <text x="22" y="234" fill="#34332f" font-size="20">ZECTRIX Cloud</text>
    </g>

    <g transform="translate(954 0)">
      <rect width="134" height="270" rx="12" fill="#11110f"/>
      <text x="18" y="40" fill="#9d9a90" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">04</text>
      <text x="18" y="86" fill="#fffef9" font-size="26" font-weight="700">NOTE4</text>
      <text x="18" y="132" fill="#c9c6bb" font-size="19">电子纸</text>
      <text x="18" y="164" fill="#c9c6bb" font-size="19">常显</text>
      <text x="18" y="196" fill="#c9c6bb" font-size="19">定期刷新</text>
    </g>

    <g fill="none" stroke="#11110f" stroke-width="3">
      <path d="M310 135H384"/><path d="M374 125L384 135L374 145"/>
      <path d="M642 135H716"/><path d="M706 125L716 135L706 145"/>
      <path d="M926 135H944"/><path d="M934 125L944 135L934 145"/>
    </g>
  </g>

  <path d="M56 460H1144" stroke="#c9c6bb"/>
  <g transform="translate(56 505)" fill="#34332f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <circle cx="7" cy="-6" r="6" fill="#11110f"/><text x="24">ONLY VISIBLE CHANGES ARE UPLOADED</text>
    <circle cx="600" cy="-6" r="6" fill="none" stroke="#11110f" stroke-width="2"/><text x="617">RADAR NEVER REPLACES OFFICIAL QUOTA</text>
  </g>
</svg>
